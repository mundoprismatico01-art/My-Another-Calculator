<!DOCTYPE html>
<html lang="en">
<head>
          <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Audiowide&family=Bungee&family=Changa+One:ital@1&family=Coiny&family=Concert+One&family=Intel+One+Mono:ital,wght@0,300..700;1,300..700&family=Lalezar&family=Luckiest+Guy&family=Michroma&family=Orbitron:wght@400..900&family=Pacifico&family=Righteous&display=swap" rel="stylesheet">
<style>*{margin: 0; padding: 0;}</style>
          <meta charset="UTF-8">
          <link rel="stylesheet" href="style.css"></link>
          <meta name="viewport" content="width=device-width, initial-scale=1.0">
          <title>Your Calculator</title>
</head>
<body>
        <header>
          <h1 id="title">Luanven Calculator</h1>
        </header>
          <div class="calculator" id="somar">
                    <h1 class="calculatortitle">Plus</h1>
                    <input type="number" id="s1"> <input type="number" id="s2">
                    <input class="button" id="p-btn" type="button" value="Show:">
                    <h1 class="subtitle" id="subtitle1">Result</h1>

          </div>
          <div class="calculator" id="subtrair">
                    <h1 class="calculatortitle">Minus</h1>
                    <input type="number" id="m1">
                    <input type="number" id="m2">
                    <input class="button" type="button" value="Show:" id="m-btn">
                    <h1 class="subtitle" id="subtitle2">Result</h1>


          </div>
          <div class="calculator" id="multiplicar">
                    <h1 class="calculatortitle">Times</h1>
                    <input type="number" id="t1">
                    <input type="number" id="t2">
                   <input type="button" class="button" id="t-btn" value="Show:">
                   <h1 class="subtitle" id="subtitle3">Result</h1>
          </div>
          <div class="calculator" id="dividir">
                    <h1 class="calculatortitle">Divide</h1>
                    <input type="number" id="d1">
                    <input type="number" id="d2">
                    <input class="button" type="button" id="d-btn" value="Show:">
                    <h1 class="subtitle" id="subtitle4">Result</h1>
          </div>

          <footer>
                    &copy;Luanven Tech
          </footer>
</body>
<script src="script.js"></script>
</html>
